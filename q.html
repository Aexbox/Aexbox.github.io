<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>3D玫瑰爱心 · ULTRA</title>
<style>
*{margin:0;padding:0}
html,body{
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
  cursor:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  filter:contrast(1.08) saturate(1.15);
}
/* ===== 呼吸文字 ===== */
.text-box{
  position:absolute;
  top:13%;
  width:100%;
  text-align:center;
  pointer-events:none;
  z-index:5;
}
.love-text{
  font-size:clamp(30px,10vw,62px);
  font-weight:900;
  letter-spacing:.06em;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:linear-gradient(100deg,#fff 0%,#ffb8d0 22%,#ff3d7f 45%,#ff7fb0 62%,#fff 85%,#ffb8d0 100%);
  background-size:280% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px #ff2d6f) drop-shadow(0 0 42px #d4004f);
  animation:shine 4.5s linear infinite, breathe 3s ease-in-out infinite;
}
@keyframes shine{
  0%{background-position:0% 50%}
  100%{background-position:280% 50%}
}
@keyframes breathe{
  0%,100%{ opacity:.85; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.05); }
}
/* ===== 副标题 ===== */
.sub-text{
  margin-top:10px;
  font-size:clamp(9px,2.6vw,13px);
  letter-spacing:.42em;
  text-indent:.42em;
  color:#ff90b8;
  font-family:system-ui,sans-serif;
  opacity:.62;
  text-shadow:0 0 12px #ff2d6f;
  animation:fadein 3s ease-out both;
}
@keyframes fadein{from{opacity:0;transform:translateY(-8px)}to{opacity:.62;transform:none}}
/* ===== 暗角 + 扫描线 ===== */
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at 50% 48%,transparent 30%,rgba(0,0,0,.72) 100%);
}
.scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
  opacity:.55;
}
/* ===== 操作提示 ===== */
.hint{
  position:absolute;bottom:18px;width:100%;text-align:center;z-index:5;
  font-size:11px;letter-spacing:.2em;color:#ff7aa8;opacity:.42;
  font-family:system-ui,sans-serif;pointer-events:none;
}
</style>
</head>
<body>
<div class="text-box">
  <div class="love-text">I love you</div>
  <div class="sub-text">FOREVER &amp; ALWAYS</div>
</div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="hint">拖动微调 · 滚轮缩放 · 点击爆发</div>
<canvas id="cv"></canvas>
<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let W, H, DPR;

// ================= 参数区 =================
const SPREAD      = 250;     // 爱心整体大小
const FOCAL       = 900;     // 透视焦距
const CAM_DIST    = 760;     // 相机距离基准
const SPIN_SPEED  = 0;       // 固定正面：不自转（如需旋转改回 0.34）
const N_HEART     = 9000;    // 主爱心粒子数
const N_GROUPS    = 10;      // 环绕小爱心组数
const N_PER_GROUP = 58;      // 每组粒子数
const GROUP_R     = 25;      // 小爱心半径
const SCATTER     = 62;      // 小爱心飞散速度
const TRAIL       = 0.19;    // 拖尾系数(越小拖尾越长)
const STAR_N      = 190;     // 星尘数量

// ================= 心跳参数 =================
const BEAT_PERIOD = 1.05;    // 心跳周期（秒）
const BEAT_AMP    = 0.16;    // 主跳幅度（横向鼓动 16%）
const BEAT_AMP2   = 0.07;    // 次跳幅度

// 4 级调色板：暗红 → 正红 → 亮粉 → 白金
const PAL = [
  [26, 2, 12],
  [124, 8, 44],
  [226, 42, 92],
  [255, 205, 224]
];
// 额外的高光／火花色（青粉撞色，增强霓虹感）
const PAL_ACCENT = [
  [120, 30, 60],
  [255, 70, 140],
  [255, 150, 200],
  [190, 240, 255]
];
// ==========================================

const TAU = Math.PI * 2;
const rand = Math.random;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ---------- 心跳包络：咚—咚 双搏 ---------- */
function beatPulse(t){
  const ph = (t % BEAT_PERIOD) / BEAT_PERIOD;
  let p1 = 0, p2 = 0;
  if (ph < 0.16){
    const u = ph / 0.16;
    p1 = Math.sin(u * Math.PI);            // 主跳：平滑起落
  }
  if (ph >= 0.17 && ph < 0.33){
    const u = (ph - 0.17) / 0.16;
    p2 = Math.sin(u * Math.PI);            // 次跳：幅度更小
  }
  return Math.min(1.6, p1 + p2 * (BEAT_AMP2 / BEAT_AMP));
}
function heartScaleY(t){ return 1 + BEAT_AMP * 0.65 * beatPulse(t); }  // 纵向
function heartScaleX(t){ return 1 + BEAT_AMP * beatPulse(t); }         // 横向（更明显）

// ---------- 爱心参数方程 ----------
function heartParam(t){
  const s3 = Math.pow(Math.sin(t), 3);
  const hx = 16 * s3 / 17;
  const hy = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 17;
  return { hx, hy };
}

// ---------- 主爱心粒子采样（三层：壳层 + 体积 + 花瓣螺旋） ----------
function sampleHeart(){
  const mode = rand();
  const t = rand() * TAU;
  const { hx, hy } = heartParam(t);

  let s, zAmp;
  if (mode < 0.42){            // 外壳：贴近表面，形成清晰轮廓
    s = 0.94 + rand() * 0.06;
    zAmp = 0.55;
  } else if (mode < 0.80){     // 体积：向内填充，营造实心感
    s = Math.pow(rand(), 0.22);
    zAmp = 0.6;
  } else {                     // 花瓣层：螺旋内卷，像玫瑰花瓣
    s = 0.35 + rand() * 0.62;
    zAmp = 0.85;
  }

  const px = hx * s, py = hy * s;
  const rr = px*px + py*py;
  const mz = zAmp * Math.sqrt(Math.max(0, 1 - rr));

  // 花瓣层附加旋转，让曲面有"卷"的感觉
  const curl = mode >= 0.80 ? (1 - s) * 0.9 : 0;
  const nx = px * Math.cos(curl) - py * Math.sin(curl);
  const ny = px * Math.sin(curl) + py * Math.cos(curl);

  return {
    x: nx * SPREAD,
    y: ny * SPREAD,
    z: (rand() - 0.5) * 2 * mz * SPREAD
  };
}

function levelOf(x, y, z){
  const d = Math.hypot(x, y, z);
  const r = rand();
  if (d > 0.84) return r < 0.72 ? 3 : 2;
  if (d > 0.56) return r < 0.48 ? 2 : 1;
  return r < 0.5 ? 1 : 0;
}

// ---------- 主爱心粒子池 ----------
const hp = [];
for (let i = 0; i < N_HEART; i++){
  const p = sampleHeart();
  const isAccent = rand() < 0.11;   // 11% 撞色高光粒子
  hp.push({
    x: p.x, y: p.y, z: p.z,
    b: levelOf(p.x / SPREAD, p.y / SPREAD, p.z / SPREAD),
    accent: isAccent,
    ph: rand() * TAU,               // 闪烁相位
    fq: 1.2 + rand() * 3.4,         // 闪烁频率
    flare: rand() < 0.035,          // 少数大光斑
    // 轻微漂移，让粒子不是死的
    dx: (rand() - 0.5) * 2.2,
    dy: (rand() - 0.5) * 2.2,
    dz: (rand() - 0.5) * 2.2
  });
}

// ---------- 环绕小爱心群 ----------
const groups = [];
for (let g = 0; g < N_GROUPS; g++){
  const t0 = g / N_GROUPS * TAU;
  const { hx, hy } = heartParam(t0);
  const sx = hx * 0.98, sy = hy * 0.98, sz = (rand() - 0.5) * 0.1;
  const len = Math.hypot(sx, sy, sz) + 1e-6;
  const dx = sx / len, dy = sy / len, dz = sz / len;

  const ps = [];
  for (let k = 0; k < N_PER_GROUP; k++){
    const tt = rand() * TAU;
    const { hx: lhx, hy: lhy } = heartParam(tt);
    const j = 0.97 + rand() * 0.06;
    ps.push({
      lx: lhx * j * GROUP_R,
      ly: lhy * j * GROUP_R,
      lz: rand() - 0.5,
      b: rand() < 0.72 ? 3 : 2,
      accent: rand() < 0.22,
      ph: rand() * TAU,
      fq: 2.5 + rand() * 3.6,
      amp: 0.34 + rand() * 0.6
    });
  }
  groups.push({
    bx: sx * SPREAD, by: sy * SPREAD, bz: sz * SPREAD,
    dx, dy, dz,
    birth: g * 0.42,
    speed: 0.9 + rand() * 0.22,
    life: 6.2 + rand() * 1.6,
    ps, wx: 0, wy: 0, wz: 0, vx: 0, vy: 0, vz: 0, ok: false
  });
}

// ---------- 星尘背景（随相机视差） ----------
const stars = [];
function seedStars(){
  stars.length = 0;
  for (let i = 0; i < STAR_N; i++){
    stars.push({
      x: rand() * W, y: rand() * H,
      z: 0.25 + rand() * 0.75,       // 视差深度
      r: 0.4 + rand() * 1.5,
      ph: rand() * TAU,
      fq: 0.6 + rand() * 2.2
    });
  }
}
seedStars();
addEventListener('resize', seedStars);

// ---------- 点击爆发粒子 ----------
const bursts = [];
function spawnBurst(sx, sy){
  const wx = (sx - W / 2) / (FOCAL / CAM_DIST);
  const wy = -(sy - H / 2) / (FOCAL / CAM_DIST);
  for (let i = 0; i < 90; i++){
    const a = rand() * TAU, sp = 90 + rand() * 330;
    bursts.push({
      x: wx, y: wy, z: (rand() - 0.5) * 90,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      vz: (rand() - 0.5) * sp * 0.9,
      life: 0.7 + rand() * 0.9,
      age: 0,
      b: rand() < 0.6 ? 3 : 2,
      accent: rand() < 0.4,
      r: 1.4 + rand() * 2.6
    });
  }
}

// ---------- 交互 ----------
let userSpin = 0, userTilt = 0;
let targetSpin = 0, targetTilt = 0;
let dragging = false, lastPX = 0, lastPY = 0;
let zoom = 1, targetZoom = 1;

function onDown(e){
  dragging = true;
  const p = e.touches ? e.touches[0] : e;
  lastPX = p.clientX; lastPY = p.clientY;
}
function onMove(e){
  if (!dragging) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - lastPX;
  const dy = p.clientY - lastPY;
  lastPX = p.clientX; lastPY = p.clientY;
  targetSpin += dx * 0.0075;
  targetTilt = Math.max(-0.5, Math.min(0.5, targetTilt + dy * 0.0052));
  if (e.cancelable) e.preventDefault();
}
function onUp(){ dragging = false; }

cv.addEventListener('mousedown', onDown);
addEventListener('mousemove', onMove);
addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, { passive: true });
addEventListener('touchmove', onMove, { passive: false });
addEventListener('touchend', onUp);
cv.addEventListener('wheel', e => {
  targetZoom = Math.max(0.55, Math.min(2.2, targetZoom * (e.deltaY > 0 ? 0.9 : 1.11)));
  e.preventDefault();
}, { passive: false });
cv.addEventListener('click', e => spawnBurst(e.clientX, e.clientY));

// 双击回正：松手后缓慢转回正面
addEventListener('dblclick', () => { targetSpin = 0; targetTilt = 0; });

// 鼠标位置驱动的光晕
let mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5;
addEventListener('mousemove', e => {
  tmx = e.clientX / W; tmy = e.clientY / H;
});

// ---------- 投影 ----------
const TILT = 0.15;
const cp0 = Math.cos(TILT), sp0 = Math.sin(TILT);
let W2 = W / 2, H2 = H / 2;

function rotY(x, z, a){
  const c = Math.cos(a), s = Math.sin(a);
  return { nx: x * c + z * s, nz: -x * s + z * c };
}
function rotX(x, y, z, a){
  const c = Math.cos(a), s = Math.sin(a);
  return { y: y * c - z * s, z: y * s + z * c };
}

function project(wx, wy, wz){
  // 先绕 X 轴做俯仰（相机倾斜 + 用户拖拽的影响已在外部处理）
  const ry = wy * cp0 - wz * sp0;
  const rz = wy * sp0 + wz * cp0;
  const dep = rz + CAM_DIST / zoom;
  if (dep <= 4) return null;
  const sc = FOCAL / dep;
  return { sx: W2 + wx * sc, sy: H2 - ry * sc, rz, sc };
}

// ---------- 高质量辉光（预渲染精灵，性能提升 + 更亮） ----------
function makeSprite(size, stops){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (const [p, col] of stops) grd.addColorStop(p, col);
  g2.beginPath();
  g2.arc(size/2, size/2, size/2, 0, TAU);
  g2.fillStyle = grd;
  g2.fill();
  return c;
}
const SPRITE = 64;
function spriteFor(rgb, coreWhite){
  const [r, g, b] = rgb;
  const stops = coreWhite
    ? [[0, 'rgba(255,255,255,1)'], [0.18, `rgba(${r},${g},${b},0.92)`],
       [0.45, `rgba(${r},${g},${b},0.28)`], [1, 'rgba(0,0,0,0)']]
    : [[0, `rgba(${Math.min(255,r+70)},${Math.min(255,g+40)},${Math.min(255,b+50)},1)`],
       [0.3, `rgba(${r},${g},${b},0.5)`], [1, 'rgba(0,0,0,0)']];
  return makeSprite(SPRITE, stops);
}
const SPR = PAL.map(c => spriteFor(c, true));
const SPR_A = PAL_ACCENT.map(c => spriteFor(c, true));
const SPR_SOFT = PAL.map(c => spriteFor(c, false));

function drawSprite(sp, x, y, r, alpha){
  if (alpha <= 0.008) return;
  ctx.globalAlpha = alpha > 1 ? 1 : alpha;
  ctx.drawImage(sp, x - r, y - r, r * 2, r * 2);
}

// ---------- 主循环 ----------
let gt = 0, last = performance.now();
let frame = 0;

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  gt += dt;
  frame++;

  // 平滑插值
  tmx += (mx - tmx) * 0.06;
  userSpin += (targetSpin - userSpin) * 0.085;
  userTilt += (targetTilt - userTilt) * 0.085;
  zoom += (targetZoom - zoom) * 0.09;

  W2 = W / 2;
  H2 = H / 2;

  // 心跳：整颗心随节律鼓动
  const bp  = beatPulse(gt);          // 0..1 包络
  const sX  = heartScaleX(gt);        // 横向缩放（幅度大）
  const sY  = heartScaleY(gt);        // 纵向缩放（幅度小）

  // 运动拖尾
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(0,0,0,${TRAIL})`;
  ctx.fillRect(0, 0, W, H);

  const spin = gt * SPIN_SPEED + userSpin;   // SPIN_SPEED=0 → 固定正面
  const tiltAll = userTilt;

  // ===== 星尘背景（视差，随心跳微微增亮） =====
  for (const s of stars){
    const px = s.x + (tmx - 0.5) * 40 * s.z - userSpin * 26 * s.z;
    const py = s.y + (tmy - 0.5) * 22 * s.z;
    const tw = 0.25 + 0.75 * Math.abs(Math.sin(gt * s.fq + s.ph));
    drawSprite(SPR_SOFT[2], px, py, s.r * 3.6, 0.30 * tw * s.z * (1 + 0.4*bp));
  }

  // ===== 环绕小爱心群（同样随心跳鼓动） =====
  for (const g of groups){
    const age = gt - g.birth;
    if ((!g.ok) || age >= g.life){
      const { nx: wx, nz: wz } = rotY(g.bx * sX, g.bz * sX, spin);
      const { nx: vx, nz: vz } = rotY(g.dx * SPREAD, g.dz * SPREAD, spin);
      g.wx = wx; g.wy = g.by * sY; g.wz = wz;
      g.vx = vx / SPREAD * SCATTER * g.speed;
      g.vy = g.dy * SCATTER * g.speed;
      g.vz = vz / SPREAD * SCATTER * g.speed;
      g.birth = gt; g.ok = true; g.age = 0;
    }
    if (!g.ok) continue;
    const age2 = gt - g.birth;
    if (age2 < 0 || age2 > g.life) continue;

    // 淡入淡出：出生时快速显现，死亡时拉长消散
    const al = age2 < 0.45 ? (age2 / 0.45) : Math.max(0, 1 - (age2 - 0.45) / (g.life - 0.45));
    const cx = g.wx + g.vx * age2;
    const cy = g.wy + g.vy * age2;
    const cz = g.wz + g.vz * age2;

    const gs = age2 * 0.24;
    const gc = Math.cos(gs), gsi = Math.sin(gs);

    for (const p of g.ps){
      const rx = p.lx * gc + p.lz * gsi;
      const rz = -p.lx * gsi + p.lz * gc;
      const lp = rotX(0, cy + p.ly * sY, cz + rz, tiltAll);
      const pr = project(cx + rx * sX, lp.y, lp.z);
      if (!pr) continue;
      const { sx, sy, rz: rzz, sc } = pr;
      if (sx < -160 || sx > W + 160 || sy < -160 || sy > H + 160) continue;

      const tw = (1 - p.amp) + p.amp * Math.abs(Math.sin(gt * p.fq + p.ph));
      const rad = Math.max(1, Math.min(3.0, 1.5 * sc));
      const d = Math.max(0, Math.min(1, (rzz + SPREAD) / (2 * SPREAD)));
      const bri = 0.45 + 0.55 * (1 - d);
      let bi = Math.round(p.b * bri * al * tw);
      bi = Math.max(0, Math.min(3, bi));
      const sp = p.accent ? SPR_A[bi] : SPR[bi];
      drawSprite(sp, sx, sy, rad * 2.05, Math.min(1, al * tw * 1.05));
    }
  }

  // ===== 主爱心（核心：随心跳明显鼓动） =====
  for (const p of hp){
    // 微小漂移（呼吸式浮动）
    p.x += p.dx * dt; p.y += p.dy * dt; p.z += p.dz * dt;
    if (p.x > SPREAD * 0.98 || p.x < -SPREAD * 0.98) p.dx *= -1;
    if (p.y > SPREAD * 0.95 || p.y < -SPREAD * 0.95) p.dy *= -1;
    if (p.z > SPREAD * 0.62 || p.z < -SPREAD * 0.62) p.dz *= -1;

    // 心跳缩放：横向撑开比纵向大 → 像心肌收缩
    const hx = p.x * sX, hy = p.y * sY, hz = p.z * sX;

    const { nx, nz } = rotY(hx, hz, spin);
    const lp = rotX(0, hy, nz, tiltAll);
    const pr = project(nx, lp.y, lp.z);
    if (!pr) continue;
    const { sx, sy, rz: rzz, sc } = pr;
    if (sx < -120 || sx > W + 120 || sy < -120 || sy > H + 120) continue;

    const tw = 0.72 + 0.28 * Math.abs(Math.sin(gt * p.fq + p.ph));
    const rad = Math.max(1, Math.min(11, 2.7 * sc)) * (1 + 0.18 * bp);  // 心跳时光斑变大
    const d = Math.max(0, Math.min(1, (rzz + SPREAD) / (2 * SPREAD)));
    const bri = 0.30 + 0.70 * (1 - d);
    let bi = Math.round(p.b * bri);
    bi = Math.max(0, Math.min(3, bi));

    const sp = p.accent ? SPR_A[bi] : SPR[bi];
    const a = (p.accent ? 0.92 : 0.86) * tw * (1 + 0.22 * bp);          // 心跳时整体提亮
    const rr = p.flare ? rad * 2.6 : rad * 1.5;
    drawSprite(sp, sx, sy, rr, a);
  }

  // ===== 点击爆发粒子 =====
  for (let i = bursts.length - 1; i >= 0; i--){
    const b2 = bursts[i];
    b2.age += dt;
    if (b2.age >= b2.life){ bursts.splice(i, 1); continue; }
    // 阻尼
    const damp = Math.pow(0.12, dt);
    b2.vx *= damp; b2.vy *= damp; b2.vz *= damp;
    b2.x += b2.vx * dt; b2.y += b2.vy * dt; b2.z += b2.vz * dt;

    const { nx, nz } = rotY(b2.x, b2.z, spin);
    const lp = rotX(0, b2.y, nz, tiltAll);
    const pr = project(nx, lp.y, lp.z);
    if (!pr) continue;
    const k = 1 - b2.age / b2.life;
    const sp = b2.accent ? SPR_A[b2.b] : SPR[b2.b];
    drawSprite(sp, pr.sx, pr.sy, b2.r * 2.4 * (0.4 + k * 0.9) * pr.sc, k * k);
  }

  // ===== 心跳冲击波：每次搏动荡出双圈光环（与鼓动同步） =====
  if (bp > 0.02){
    const k1 = 1 - bp;
    ctx.globalAlpha = bp * 0.20;
    ctx.strokeStyle = 'rgba(255,80,150,1)';
    ctx.lineWidth = 2.8 * bp + 0.6;
    const r1 = SPREAD * 0.72 * (0.58 + (1 - k1) * 1.7);
    ctx.beginPath();
    ctx.ellipse(W2, H2, r1 * 0.92, r1 * 0.78, 0, 0, TAU);
    ctx.stroke();

    if (bp > 0.45){
      const k2 = (bp - 0.45) / 0.55;
      ctx.globalAlpha = k2 * 0.12;
      ctx.lineWidth = 2.0 * k2 + 0.5;
      const r2 = SPREAD * 0.72 * (0.50 + (1 - k2) * 1.5);
      ctx.beginPath();
      ctx.ellipse(W2, H2, r2 * 0.92, r2 * 0.78, 0, 0, TAU);
      ctx.stroke();
    }
  }

  // ===== 中心环境光晕（随心跳明显呼吸） =====
  const puls = (0.78 + 0.22 * Math.sin(gt * 1.7)) * (0.80 + 1.4 * bp);
  const grd = ctx.createRadialGradient(W2, H2, 0, W2, H2, Math.min(W, H) * 0.55);
  grd.addColorStop(0, `rgba(255,40,110,${0.075 * puls})`);
  grd.addColorStop(0.5, `rgba(180,10,70,${0.032 * puls})`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
