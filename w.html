<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>3D玫瑰爱心</title>
<style>
*{margin:0;padding:0}
html,body{
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
.text-box{
  position:absolute;
  top:16%;
  width:100%;
  text-align:center;
  pointer-events:none;
}
.love-text{
  font-size:clamp(26px,9vw,48px);
  color:#ffb8d0;
  font-weight:bold;
  font-family:system-ui, sans-serif;
  text-shadow:0 0 20px #ec4882, 0 0 40px #dd2266;
  animation: breathe 2.8s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ opacity:0.75; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.06); }
}
</style>
</head>
<body>
<div class="text-box">
  <div class="love-text">I love you</div>
</div>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W,H;

// ========= 参数区，可以自己调 =========
const SPREAD=240;        // 爱心大小
const FOCAL=860;         // 透视强度
const CAM_DIST=740;       // 相机距离
const SPIN_SPEED=0.45;   // 旋转速度
const GROUP_SPIN_SPEED=0.21;
const SCATTER_SPEED_BASE=60;
const N_HEART=6600;      // 主粒子数
const N_GROUPS=7;
const N_PER_GROUP=50;
const GROUP_R=26;
const PAL=[
  [30,2,12],
  [130,10,45],
  [230,50,95],
  [255,170,195]
];
// =====================================

const TAU=Math.PI*2;

function resize(){
  W=innerWidth;
  H=innerHeight;
  cv.width=W;
  cv.height=H;
}
resize();
addEventListener('resize',resize);

let gt=0,last=performance.now();

function heartParam(t){
  const s3=Math.pow(Math.sin(t),3);
  const hx=16*s3/17;
  const hy=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17;
  return {hx,hy};
}

function sample(){
  const t=Math.random()*TAU;
  const {hx,hy}=heartParam(t);
  const s=Math.pow(Math.random(),0.18);
  const px=hx*s,py=hy*s;
  const mz=0.6*Math.sqrt(Math.max(0,1-px*px-py*py));
  return {x:px*SPREAD,y:py*SPREAD,z:(Math.random()-.5)*2*mz*SPREAD};
}

function level(x,y,z){
  const d=Math.hypot(x,y,z);
  const r=Math.random();
  if(d>.82) return r<.7?3:2;
  if(d>.55) return r<.45?2:1;
  return r<.5?1:0;
}

let hp=[];
for(let i=0;i<N_HEART;i++){
  const p=sample();
  hp.push({x:p.x,y:p.y,z:p.z,b:level(p.x/SPREAD,p.y/SPREAD,p.z/SPREAD)});
}

let groups=[];
for(let g=0;g<N_GROUPS;g++){
  const t0=g/N_GROUPS*TAU;
  const {hx,hy}=heartParam(t0);
  let sx=hx*.95,sy=hy*.95,sz=(Math.random()-.5)*0.08;
  const len=Math.hypot(sx,sy,sz)+1e-6;
  let dx=sx/len,dy=sy/len,dz=sz/len;
  let ps=[];
  for(let k=0;k<N_PER_GROUP;k++){
    const tt=Math.random()*TAU;
    const {hx:lhx,hy:lhy}=heartParam(tt);
    const j=0.98+Math.random()*0.04;
    ps.push({
      lx:lhx*j*GROUP_R,
      ly:lhy*j*GROUP_R,
      lz:Math.random()-0.5,
      b:Math.random()<0.75?3:2,
      ph:Math.random()*TAU,
      fq:2.5+Math.random()*3.4,
      amp:0.36+Math.random()*0.58
    });
  }
  groups.push({
    bx:sx*SPREAD,by:sy*SPREAD,bz:sz*SPREAD,
    dx,dy,dz,
    birth:g*0.5,
    speed:0.9+Math.random()*0.18,
    life:6+Math.random()*1.4,
    ps,wx:0,wy:0,wz:0,vx:0,vy:0,vz:0,ok:false
  });
}

function rotY(x,z,a){
  const c=Math.cos(a),s=Math.sin(a);
  return {nx:x*c+z*s,nz:-x*s+z*c};
}

const cp=Math.cos(0.15),sp=Math.sin(0.15);

function proj(wx,wy,wz){
  const rz2=wz*cp-wy*sp;
  const ry2=wz*sp+wy*cp;
  const dep=rz2+CAM_DIST;
  if(dep<=4) return null;
  const sc=FOCAL/dep;
  return {sx:W/2+wx*sc,sy:H/2-ry2*sc,rz2,sc};
}

function glow(x,y,r,rgb,a){
  try{
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`);
    g.addColorStop(0.4,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a*0.3})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(x,y,r,0,TAU);
    ctx.fillStyle=g;
    ctx.fill();
  }catch(e){}
}

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  gt+=dt;

  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.fillRect(0,0,W,H);

  const spin=gt*SPIN_SPEED;

  for(let g of groups){
    const age=gt-g.birth;
    if((!g.ok)||age>=g.life){
      const {nx:wx,nz:wz}=rotY(g.bx,g.bz,spin);
      const {nx:vx,nz:vz}=rotY(g.dx*SPREAD,g.dz*SPREAD,spin);
      g.wx=wx;g.wy=g.by;g.wz=wz;
      g.vx=vx/SPREAD*SCATTER_SPEED_BASE*g.speed;
      g.vy=g.dy*SCATTER_SPEED_BASE*g.speed;
      g.vz=vz/SPREAD*SCATTER_SPEED_BASE*g.speed;
      g.birth=gt;g.ok=true;
    }
    if(!g.ok)continue;
    const age2=gt-g.birth;
    if(age2<0||age2>g.life)continue;
    const al=Math.max(0,1-age2/g.life);
    const cx=g.wx+g.vx*age2;
    const cy=g.wy+g.vy*age2;
    const cz=g.wz+g.vz*age2;
    const gs=age2*GROUP_SPIN_SPEED;
    const gc=Math.cos(gs),gsi=Math.sin(gs);
    for(let p of g.ps){
      const rx=p.lx*gc+p.lz*gsi;
      const rz=-p.lx*gsi+p.lz*gc;
      const pr=proj(cx+rx,cy+p.ly,cz+rz);
      if(!pr)continue;
      const {sx,sy,rz2,sc}=pr;
      if(sx<-150||sx>W+150||sy<-150||sy>H+150)continue;
      const tw=(1-p.amp)+p.amp*Math.abs(Math.sin(gt*p.fq+p.ph));
      const rad=Math.max(1,Math.min(2.7,1.4*sc));
      const d=Math.max(0,Math.min(1,(rz2+SPREAD)/(2*SPREAD)));
      const bri=0.4+0.6*(1-d);
      let bi=Math.round(p.b*bri*al*tw);
      bi=Math.max(0,Math.min(3,bi));
      glow(sx,sy,rad*1.9,PAL[bi],Math.min(0.9,al*tw));
    }
  }

  for(let p of hp){
    const {nx,nz}=rotY(p.x,p.z,spin);
    const pr=proj(nx,p.y,nz);
    if(!pr)continue;
    const {sx,sy,rz2,sc}=pr;
    if(sx<-100||sx>W+100||sy<-100||sy>H+100)continue;
    const rad=Math.max(1,Math.min(9,2.6*sc));
    const d=Math.max(0,Math.min(1,(rz2+SPREAD)/(2*SPREAD)));
    const bri=0.32+0.68*(1-d);
    let bi=Math.round(p.b*bri);
    bi=Math.max(0,Math.min(3,bi));
    glow(sx,sy,rad*1.45,PAL[bi],0.88);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
