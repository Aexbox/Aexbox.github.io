<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写给小星的宇宙</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<style>
  :root {
    --bg-deep: #050816;
    --bg-mid: #0a1030;
    --star: #ffe9a8;
    --pink: #ff9ec7;
    --pink-soft: #ffd3e4;
    --text: #e8ecff;
    --text-dim: #9aa5d1;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    overflow-x: hidden;
  }

  /* ---------- 星空画布 ---------- */
  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  section, footer {
    position: relative;
    z-index: 1;
  }

  /* ---------- 首屏 ---------- */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
  }

  .hero-planet {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #ffd9ea, var(--pink) 45%, #b8568b 90%);
    box-shadow:
      0 0 40px rgba(255, 158, 199, 0.55),
      0 0 120px rgba(255, 158, 199, 0.25);
    margin-bottom: 36px;
    animation: float 6s ease-in-out infinite;
    position: relative;
  }

  .hero-planet::after {
    content: "";
    position: absolute;
    left: -26px;
    right: -26px;
    top: 50%;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255, 211, 228, 0.7);
    transform: rotate(-18deg);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .hero h1 {
    font-size: clamp(30px, 6vw, 56px);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }

  .hero h1 .name { color: var(--pink); text-shadow: 0 0 24px rgba(255, 158, 199, 0.5); }

  .hero .universe-line {
    font-size: clamp(15px, 2.4vw, 19px);
    color: var(--text-dim);
    letter-spacing: 4px;
    margin-bottom: 52px;
  }

  .scroll-hint {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    animation: bob 2.2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.6; }
    50% { transform: translate(-50%, 8px); opacity: 1; }
  }

  /* ---------- 通用区块 ---------- */
  .section {
    max-width: 960px;
    margin: 0 auto;
    padding: 110px 24px;
  }

  .section-title {
    text-align: center;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: 6px;
    margin-bottom: 12px;
  }

  .section-sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 56px;
  }

  /* ---------- 倒计时 ---------- */
  .countdown-grid {
    display: flex;
    justify-content: center;
    gap: clamp(12px, 3vw, 28px);
    flex-wrap: wrap;
  }

  .cd-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    backdrop-filter: blur(8px);
    padding: 28px 20px;
    min-width: clamp(80px, 18vw, 130px);
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  .cd-num {
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 700;
    color: var(--star);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(255, 233, 168, 0.4);
  }

  .cd-label {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 3px;
  }

  .cd-total {
    text-align: center;
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 15px;
    letter-spacing: 2px;
    line-height: 2;
  }

  .cd-total b { color: var(--pink); font-weight: 600; }

  /* ---------- 照片墙 ---------- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 28px;
  }

  /* 只有一张照片时居中放大，不要挤成小方块 */
  .photo-grid.single {
    grid-template-columns: minmax(0, 420px);
    justify-content: center;
  }

  .photo-grid.single .ph { aspect-ratio: 1 / 1; }

  .polaroid {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 14px 18px;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: default;
  }

  .polaroid:hover {
    transform: translateY(-8px) rotate(-1.2deg);
    box-shadow: 0 18px 40px rgba(255, 158, 199, 0.18);
  }

  .polaroid:nth-child(2n):hover { transform: translateY(-8px) rotate(1.2deg); }

  .polaroid .ph {
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
  }

  .polaroid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ph.g1 { background: linear-gradient(135deg, #2b1a5e, #6e3a8f 60%, #d16ba5); }
  .ph.g2 { background: linear-gradient(135deg, #0f2c5e, #2a6db5 60%, #7fc8f8); }
  .ph.g3 { background: linear-gradient(135deg, #5e1a33, #a34054 60%, #ff9ec7); }
  .ph.g4 { background: linear-gradient(135deg, #123c2f, #2f8f6a 60%, #a8f0c6); }

  .polaroid .cap {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ---------- 摘星小游戏 ---------- */
  .game-box {
    position: relative;
    height: 420px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--card-border);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .game-star {
    position: absolute;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    filter: drop-shadow(0 0 10px rgba(255, 233, 168, 0.9));
    animation: twinkle 1.6s ease-in-out infinite;
    transition: transform 0.15s ease;
    user-select: none;
  }

  .game-star:hover { transform: scale(1.35); }

  @keyframes twinkle {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  .game-star.picked {
    animation: pop 0.4s ease forwards;
    pointer-events: none;
  }

  @keyframes pop {
    to { transform: scale(2.4) rotate(30deg); opacity: 0; }
  }

  .game-hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
    pointer-events: none;
  }

  .game-hud b { color: var(--star); }

  .game-tip {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
  }

  .star-msg {
    position: fixed;
    z-index: 50;
    max-width: 280px;
    background: rgba(20, 16, 40, 0.92);
    border: 1px solid rgba(255, 233, 168, 0.35);
    color: var(--pink-soft);
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.7;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    animation: rise 2.4s ease forwards;
    pointer-events: none;
  }

  @keyframes rise {
    0% { transform: translateY(6px); opacity: 0; }
    12% { transform: translateY(0); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-24px); opacity: 0; }
  }

  /* ---------- 情书 ---------- */
  .letter-card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 48px clamp(24px, 6vw, 56px);
    backdrop-filter: blur(8px);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
  }

  .letter-card .stamp {
    font-size: 34px;
    text-align: center;
    margin-bottom: 24px;
  }

  #typewriter {
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 2.2;
    letter-spacing: 1px;
    min-height: 140px;
    color: var(--text);
  }

  #typewriter .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: var(--pink);
    vertical-align: -0.2em;
    margin-left: 3px;
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .letter-sign {
    margin-top: 28px;
    text-align: right;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 2px;
  }

  .letter-sign b { color: var(--pink); font-weight: 600; }

  /* ---------- 页脚 ---------- */
  footer {
    text-align: center;
    padding: 60px 24px 80px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 3px;
  }

  footer .heart { color: var(--pink); }

  /* 入场动画 */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<!-- 首屏 -->
<section class="hero">
  <div class="hero-planet"></div>
  <h1 id="heroTitle"></h1>
  <p class="universe-line" id="universeLine"></p>
  <div class="scroll-hint">向下滚动 · 开启这个宇宙 ↓</div>
</section>

<!-- 倒计时 -->
<section class="section reveal" id="countdown">
  <h2 class="section-title">恋爱倒计时</h2>
  <p class="section-sub">从那一天起，我的每颗星星都朝着你</p>
  <div class="countdown-grid">
    <div class="cd-card"><div class="cd-num" id="cdDays">0</div><div class="cd-label">天</div></div>
    <div class="cd-card"><div class="cd-num" id="cdHours">0</div><div class="cd-label">时</div></div>
    <div class="cd-card"><div class="cd-num" id="cdMinutes">0</div><div class="cd-label">分</div></div>
    <div class="cd-card"><div class="cd-num" id="cdSeconds">0</div><div class="cd-label">秒</div></div>
  </div>
  <p class="cd-total" id="cdTotal"></p>
</section>

<!-- 照片墙 -->
<section class="section reveal" id="photos">
  <h2 class="section-title">我们的星轨相册</h2>
  <p class="section-sub">每一步脚印，都是绕着你转的一圈轨道</p>
  <div class="photo-grid" id="photoGrid"></div>
</section>

<!-- 摘星小游戏 -->
<section class="section reveal" id="game">
  <h2 class="section-title">摘一颗星星送你</h2>
  <p class="section-sub">每颗星星里都藏着一句想说的话</p>
  <div class="game-box" id="gameBox">
    <div class="game-hud">
      <span>已摘到 <b id="starCount">0</b> 颗星星</span>
      <span>共 <b id="starTotal">0</b> 颗</span>
    </div>
    <div class="game-tip">点一点闪闪的星星 ⭐</div>
  </div>
</section>

<!-- 情书 -->
<section class="section reveal" id="letter">
  <h2 class="section-title">来自地球的情书</h2>
  <p class="section-sub">写给你，收件人：我的整个宇宙</p>
  <div class="letter-card">
    <div class="stamp">💌</div>
    <div id="typewriter"><span id="typeText"></span><span class="cursor"></span></div>
    <div class="letter-sign" id="letterSign"></div>
  </div>
</section>

<footer>
  <span id="footerText"></span> · 用<span class="heart">♥</span>和代码写成
</footer>

<script src="config.js"></script>
<script>
/* ================= 标题 ================= */
document.title = "写给" + CONFIG.herName + "的宇宙";
document.getElementById("heroTitle").innerHTML =
  CONFIG.yourName + " & <span class='name'>" + CONFIG.herName + "</span>";
document.getElementById("universeLine").textContent = CONFIG.universeLine;
document.getElementById("letterSign").innerHTML =
  "—— 永远你的 · <b>" + CONFIG.yourName + "</b>";
document.getElementById("footerText").textContent = CONFIG.footer;

/* ================= 星空背景 ================= */
const sky = document.getElementById("sky");
const ctx = sky.getContext("2d");
let stars = [], meteors = [];

function resizeSky() {
  sky.width = window.innerWidth;
  sky.height = window.innerHeight;
  const count = Math.floor(sky.width * sky.height / 3800);
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * sky.width,
    y: Math.random() * sky.height,
    r: Math.random() * 1.4 + 0.3,
    base: Math.random() * 0.6 + 0.25,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.015 + 0.005,
    pink: Math.random() < 0.12
  }));
}
resizeSky();
window.addEventListener("resize", resizeSky);

function spawnMeteor() {
  meteors.push({
    x: Math.random() * sky.width * 0.8 + sky.width * 0.2,
    y: -20,
    vx: -(Math.random() * 4 + 5),
    vy: Math.random() * 3 + 4,
    life: 1
  });
}
setInterval(() => { if (Math.random() < 0.5) spawnMeteor(); }, 2600);

(function drawSky() {
  ctx.clearRect(0, 0, sky.width, sky.height);
  const t = Date.now() / 1000;
  for (const s of stars) {
    const a = s.base + Math.sin(t * s.speed * 60 + s.phase) * 0.25;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.pink
      ? "rgba(255,158,199," + Math.max(a, 0.05).toFixed(3) + ")"
      : "rgba(255,240,200," + Math.max(a, 0.05).toFixed(3) + ")";
    ctx.fill();
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy; m.life -= 0.012;
    if (m.life <= 0 || m.y > sky.height + 40) { meteors.splice(i, 1); continue; }
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
    grad.addColorStop(0, "rgba(255,255,255," + m.life.toFixed(2) + ")");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
    ctx.stroke();
  }
  requestAnimationFrame(drawSky);
})();

/* ================= 倒计时 ================= */
const anniv = new Date(CONFIG.anniversary + "T00:00:00");
function pad(n) { return String(n).padStart(2, "0"); }
function tick() {
  let diff = Date.now() - anniv.getTime();
  if (diff < 0) diff = 0;
  const s = Math.floor(diff / 1000);
  const days = Math.floor(s / 86400);
  const hours = Math.floor(s % 86400 / 3600);
  const minutes = Math.floor(s % 3600 / 60);
  const seconds = s % 60;
  document.getElementById("cdDays").textContent = days;
  document.getElementById("cdHours").textContent = pad(hours);
  document.getElementById("cdMinutes").textContent = pad(minutes);
  document.getElementById("cdSeconds").textContent = pad(seconds);
  document.getElementById("cdTotal").innerHTML =
    "我们已经一起走过 <b>" + days + "</b> 天 · 约 <b>" +
    Math.floor(days / 365) + "</b> 年 <b>" + days % 365 + "</b> 天 · 超过 <b>" +
    Math.floor(days / 7) + "</b> 个想你的周末";
}
tick();
setInterval(tick, 1000);

/* ================= 照片墙 ================= */
const grid = document.getElementById("photoGrid");
const emojis = ["🌙", "🎬", "🍜", "🚀", "🐚", "🎡", "☕", "🎂"];
const grads = ["g1", "g2", "g3", "g4"];
const phList = CONFIG.photos && CONFIG.photos.length
  ? CONFIG.photos
  : CONFIG.placeholderCaptions.map((c, i) => ({ src: "", caption: c }));

if (phList.length === 1) grid.classList.add("single");

phList.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "polaroid";
  const inner = document.createElement("div");
  inner.className = "ph " + grads[i % grads.length];
  if (p.src) {
    const img = document.createElement("img");
    img.src = p.src;
    img.alt = p.caption || "我们的回忆";
    inner.appendChild(img);
  } else {
    inner.textContent = emojis[i % emojis.length];
  }
  const cap = document.createElement("div");
  cap.className = "cap";
  cap.textContent = p.caption || "我们的回忆";
  card.appendChild(inner);
  card.appendChild(cap);
  grid.appendChild(card);
});

/* ================= 摘星小游戏 ================= */
const gameBox = document.getElementById("gameBox");
const msgs = CONFIG.starMessages;
const starTotal = msgs.length;
document.getElementById("starTotal").textContent = starTotal;
let picked = 0;

msgs.forEach((msg, i) => {
  const st = document.createElement("div");
  st.className = "game-star";
  st.textContent = Math.random() < 0.25 ? "✨" : "⭐";
  st.style.left = (8 + Math.random() * 78) + "%";
  st.style.top = (12 + Math.random() * 68) + "%";
  st.style.animationDelay = (Math.random() * 1.5) + "s";
  st.title = "点我";
  st.addEventListener("click", (e) => {
    if (st.classList.contains("picked")) return;
    st.classList.add("picked");
    picked++;
    document.getElementById("starCount").textContent = picked;
    const tip = document.createElement("div");
    tip.className = "star-msg";
    tip.textContent = msg;
    tip.style.left = Math.min(e.clientX - 100, window.innerWidth - 300) + "px";
    tip.style.top = Math.max(e.clientY - 70, 10) + "px";
    document.body.appendChild(tip);
    setTimeout(() => tip.remove(), 2400);
    if (picked === starTotal) {
      setTimeout(() => {
        const done = document.createElement("div");
        done.className = "star-msg";
        done.textContent = "🎉 你把所有星星都摘下来了——果然，你就是那个把整片星空都带走的人。";
        done.style.left = "50%";
        done.style.transform = "translateX(-50%)";
        done.style.top = (gameBox.getBoundingClientRect().top + 60) + "px";
        done.style.maxWidth = "360px";
        done.style.textAlign = "center";
        document.body.appendChild(done);
        setTimeout(() => done.remove(), 3200);
      }, 400);
    }
  });
  gameBox.appendChild(st);
});

/* ================= 情书打字机 ================= */
const typeText = document.getElementById("typeText");
const letter = CONFIG.loveLetter;
let ti = 0, typed = false;
function type() {
  if (ti <= letter.length) {
    typeText.textContent = letter.slice(0, ti);
    ti++;
    setTimeout(type, 90);
  }
}
const letterIO = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting && !typed) { typed = true; type(); }
  });
}, { threshold: 0.3 });
letterIO.observe(document.getElementById("letter"));

/* ================= 入场动画 ================= */
const revealIO = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) en.target.classList.add("show");
  });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach((el) => revealIO.observe(el));
</script>
</body>
</html>
