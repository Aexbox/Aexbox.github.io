<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>风铃 · 粒子</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03030A}
  #gl{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;bottom:12px;color:rgba(255,255,255,.4);
       font:12px/1.6 "Microsoft YaHei",sans-serif;user-select:none;pointer-events:none}
  #hud b{color:rgba(255,220,120,.85);font-weight:600}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:rgba(3,3,10,.72);backdrop-filter:blur(3px);z-index:9;cursor:pointer}
  #start .b{text-align:center;color:#fff}
  #start .t{font:600 20px/1.8 "Microsoft YaHei",sans-serif;letter-spacing:2px}
  #start .s{font:13px/2 "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.55)}
  #start .g{display:inline-block;margin-top:10px;padding:9px 26px;border-radius:22px;
            border:1px solid rgba(255,215,120,.5);color:#FFD978;font-size:14px}
  .hidden{display:none !important}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       color:#ff9a9a;font:14px/2 "Microsoft YaHei",sans-serif;text-align:center;padding:30px;z-index:20}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><b>M</b> 静音 / 开声</div>
<div id="start">
  <div class="b">
    <div class="t">风　铃</div>
    <div class="s">点击进入，开启声音</div>
    <div class="g">开 始</div>
  </div>
</div>
<div id="err" class="hidden"></div>

<script>
"use strict";
/* =============================================================
   粒子风铃 · Python(moderngl/GLFW/pygame) → WebGL2 + Web Audio
   ============================================================= */

const CV = document.getElementById('gl');
const gl = CV.getContext('webgl2', {antialias:true, alpha:false, powerPreference:'high-performance'});
if(!gl){
  const e=document.getElementById('err');
  e.classList.remove('hidden');
  e.textContent='当前浏览器不支持 WebGL2，无法运行本页面。请使用较新版本的 Chrome / Edge / Firefox / Safari。';
  throw new Error('WebGL2 unavailable');
}

/* -------------------- 参数（与 Python 版一致） -------------------- */
const N_ROPES = 6, N_FL_PER_ROPE = 6, N_FL = N_ROPES*N_FL_PER_ROPE;
const ROPE_TOP_Z = 0.0, ROPE_LEN = 5.2, ROPE_R = 0.022;
const HANG_GAP = 0.85, RING_R = 0.95, RING_TUBE_R = 0.035;
const TOP_BIND_Z = 1.2, TOP_ROPES_R = 0.022;
const F_R = 0.32, F_H = 0.48;
const ROT_SPEED = 1.0, CENTRIFUGAL = 0.35, WIND_STRENGTH = 0.20, SWAY = 0.10;
const CLASH_THRESHOLD_3D = 0.72, MAX_CLASH_PER_FRAME = 3;
const PIVOT_Z = ROPE_TOP_Z;

let muted = false;

/* ============================================================
   ★★★ 粒子数量参数 ★★★  （想增减粒子，改这一行即可）
   ------------------------------------------------------------
   FLOWER_MAX : 花朵粒子上限。可用花点共 699840 = 36朵 × 19440
                调大 → 花更饱满；调小 → 更省性能
   NP         : 花粉粒子数量（见文件下方 “花粉 VAO” 处）
   ------------------------------------------------------------
   改动记录：
     · "增加粒子数"：花朵 400000 → 699840（用满全部）
                     垂绳 600 → 900 段、吊绳 300 → 450 段，周向 14 → 18
                     花粉 600 → 1600
     · "去除手机限制"：删除了手机/桌面的设备判定（原 IS_SMALL），
                       手机与桌面统一使用相同的完整参数与配色，
                       不再自动降级。
     · "修复高DPI点过小"：gl_PointSize 原先写死 5.0/3.2/4.0 物理像素，
                       在 dpr=2~3 的手机上等效 CSS 只有 1.7~2.5px，
                       而内容被拉到 2000+ 物理像素 → 点细如尘埃、整体发暗。
                       现改为按 u_dpr 缩放，并把基准值降到 2.6/1.8/2.2。
   ============================================================ */
/* ★ "去除手机限制"：原先按屏幕尺寸/UA 判定 IS_SMALL 并对手机降级，
   现已移除。所有设备统一使用完整粒子数与原始配色。 */
const FLOWER_MAX = 699840;                       // 全部花朵点，不再按设备区分

/* -------------------- 可复现随机（等价 default_rng(2026)） -------------------- */
/* mulberry32：小巧、与平台无关，保证每次刷新几何一致 */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let _rnd = mulberry32(2026);
const rnd   = ()=>_rnd();
const rndNN = ()=>{                  // 标准正态（Box-Muller）
  let u=0,v=0;
  while(u===0) u=_rnd();
  while(v===0) v=_rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
};
const rndUni = (a,b)=>a+(b-a)*_rnd();
const rndInt = n=>Math.floor(_rnd()*n);

/* -------------------- 网格生成（对应 Python 各 mesh 函数） -------------------- */
function flowerMesh(R, H, nu=100, nv=180){
  const out = new Float32Array(nu*nv*3);
  const UU=[0,0.10,0.25,0.45,0.65,0.85,1.00];
  const RR=[0.48,0.72,0.88,0.96,1.00,0.99,0.84];
  const half=Math.PI/6, period=2*Math.PI/6;
  let p=0;
  for(let i=0;i<nu;i++){
    const u = nu>1 ? i/(nu-1) : 0;
    for(let j=0;j<nv;j++){
      const V = 2*Math.PI*j/nv;
      // 线性插值 r(u)
      let r=0;
      for(let k=0;k<UU.length-1;k++){
        if(u>=UU[k] && u<=UU[k+1]){
          const tt=(u-UU[k])/(UU[k+1]-UU[k]||1);
          r = RR[k]+(RR[k+1]-RR[k])*tt;
          break;
        }
      }
      r *= R;
      r *= 1 + 0.28*Math.cos(6*V)*Math.pow(u,8);
      r *= 1 + 0.55*Math.exp(-Math.pow((u-0.98)/0.08,2));
      let z = -H*u - 0.05*H*Math.exp(-Math.pow((u-0.98)/0.06,2));
      // 花瓣尖端外翘
      let Vm = V % period;
      const Vc = Vm>half ? Vm-period : Vm;
      const w = Math.exp(-Math.pow(Vc/(0.38*half),2));
      const t = Math.min(1,Math.max(0,(u-0.86)/0.14));
      r += 0.13*R*w*t;
      z += 0.22*H*w*t*t;
      out[p++] = r*Math.cos(V);
      out[p++] = r*Math.sin(V);
      out[p++] = z;
    }
  }
  return out;
}
function capMesh(outer, nr=8, nc=180){
  const out = new Float32Array(nr*nc*3);
  let p=0;
  for(let i=0;i<nr;i++){
    const r = nr>1 ? outer*i/(nr-1) : 0;
    for(let j=0;j<nc;j++){
      const th = 2*Math.PI*j/nc;
      out[p++]=r*Math.cos(th); out[p++]=r*Math.sin(th); out[p++]=0;
    }
  }
  return out;
}
function tubeMesh(p0, p1, radius, nlen=120, nside=10){
  const ax=[p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]];
  let L = Math.hypot(ax[0],ax[1],ax[2])||1e-9;
  const a=[ax[0]/L, ax[1]/L, ax[2]/L];
  const ref = Math.abs(a[2])<0.9 ? [0,0,1] : [1,0,0];
  let u=[ a[1]*ref[2]-a[2]*ref[1], a[2]*ref[0]-a[0]*ref[2], a[0]*ref[1]-a[1]*ref[0] ];
  let ul = Math.hypot(u[0],u[1],u[2])||1e-9;
  u=[u[0]/ul,u[1]/ul,u[2]/ul];
  const v=[ a[1]*u[2]-a[2]*u[1], a[2]*u[0]-a[0]*u[2], a[0]*u[1]-a[1]*u[0] ];
  const out = new Float32Array(nlen*nside*3);
  let p=0;
  for(let i=0;i<nlen;i++){
    const t = nlen>1 ? i/(nlen-1) : 0;
    const cx=p0[0]+t*(p1[0]-p0[0]), cy=p0[1]+t*(p1[1]-p0[1]), cz=p0[2]+t*(p1[2]-p0[2]);
    for(let j=0;j<nside;j++){
      const ph = 2*Math.PI*j/nside;
      const cs=Math.cos(ph)*radius, sn=Math.sin(ph)*radius;
      out[p++] = cx + cs*u[0] + sn*v[0];
      out[p++] = cy + cs*u[1] + sn*v[1];
      out[p++] = cz + cs*u[2] + sn*v[2];
    }
  }
  return out;
}
function ringMesh(nlen=480, nside=12){
  const out = new Float32Array(nlen*nside*3);
  let p=0;
  for(let i=0;i<nlen;i++){
    const th = 2*Math.PI*i/nlen;
    for(let j=0;j<nside;j++){
      const ph = 2*Math.PI*j/nside;
      const r = RING_R + RING_TUBE_R*Math.cos(ph);
      out[p++] = r*Math.cos(th);
      out[p++] = r*Math.sin(th);
      out[p++] = RING_TUBE_R*Math.sin(ph);
    }
  }
  return out;
}
function bowLoopMesh(cx, a, b, tube_r, n_loop=250, n_ring=8){
  const out = new Float32Array(n_loop*n_ring*3);
  let p=0;
  for(let i=0;i<n_loop;i++){
    const T = 2*Math.PI*i/n_loop;
    const lx = cx + a*Math.cos(T), lz = b*Math.sin(T);
    let nx = b*Math.cos(T), nz = a*Math.sin(T);
    const nn = Math.hypot(nx,nz)||1e-9;
    nx/=nn; nz/=nn;
    for(let j=0;j<n_ring;j++){
      const S = 2*Math.PI*j/n_ring;
      out[p++] = lx + tube_r*Math.cos(S)*nx;
      out[p++] = tube_r*Math.sin(S);
      out[p++] = lz + tube_r*Math.cos(S)*nz;
    }
  }
  return out;
}
function bowPts(center, scale=1.2){
  const a=0.20*scale, b=0.13*scale, tube_r=0.022*scale, cx=0.18*scale;
  const parts=[];
  for(const side of [-1,1]) parts.push(bowLoopMesh(side*cx, a, b, tube_r));
  // 中心结：球状随机点
  const n_knot=400, r=0.06*scale;
  const knot=new Float32Array(n_knot*3);
  let p=0;
  for(let i=0;i<n_knot;i++){
    const theta=rndUni(0,2*Math.PI);
    const phi=Math.acos(rndUni(-1,1));
    const rr=r*(0.8+0.2*rnd());
    knot[p++] = rr*Math.sin(phi)*Math.cos(theta);
    knot[p++] = rr*Math.sin(phi)*Math.sin(theta);
    knot[p++] = rr*Math.cos(phi);
  }
  const total = parts.reduce((s,x)=>s+x.length,0) + knot.length;
  const out = new Float32Array(total);
  let q=0;
  for(const part of parts){
    for(let i=0;i<part.length;i++){
      out[q++] = part[i] + rndNN()*0.002;
    }
  }
  for(let i=0;i<knot.length;i++){
    out[q++] = knot[i] + rndNN()*0.002;
  }
  for(let i=0;i<q;i+=3){
    out[i]   += center[0];
    out[i+1] += center[1];
    out[i+2] += center[2];
  }
  return out;
}

/* -------------------- 组装全部顶点 -------------------- */
const PfArr=[], KfArr=[], GfArr=[], RfArr=[];   // 花朵
const flowerCenters = [];
const FLOWER_PER = 18000 + 1440;                // flowerMesh + capMesh

const flowerBase  = flowerMesh(F_R, F_H);
const capBase     = capMesh(0.48*F_R);

for(let i=0;i<N_ROPES;i++){
  const ang = i*2*Math.PI/N_ROPES;
  const x0 = RING_R*Math.cos(ang), y0 = RING_R*Math.sin(ang);
  for(let j=0;j<N_FL_PER_ROPE;j++){
    const center = [x0, y0, ROPE_TOP_Z-(j+1)*HANG_GAP];
    const fi = i*N_FL_PER_ROPE + j;
    const tilt = rndUni(0, Math.PI*2);          // 注意：Python 是 radians(uniform(0,360))
    const ct=Math.cos(tilt), st=Math.sin(tilt);
    for(const m of [flowerBase, capBase]){
      const n = m.length/3;
      const P=new Float32Array(n*3), K=new Float32Array(n), G=new Float32Array(n), R=new Float32Array(n);
      for(let k=0;k<n;k++){
        const mx=m[k*3], my=m[k*3+1], mz=m[k*3+2];
        const xp = mx*ct - my*st;
        const yp = mx*st + my*ct;
        const jx = rndNN()*0.004;             // jitter(0.004)
        const jy = rndNN()*0.004;
        const jz = rndNN()*0.004;
        P[k*3]   = xp + center[0] + jx;
        P[k*3+1] = yp + center[1] + jy;
        P[k*3+2] = mz + center[2] + jz;
        K[k]=0; G[k]=fi; R[k]=i;
      }
      PfArr.push(P); KfArr.push(K); GfArr.push(G); RfArr.push(R);
    }
    flowerCenters.push(center.slice());
  }
}

// 花朵抽样：源头 699840 点，按 FLOWER_MAX 决定保留多少（★ 见文件顶部参数区）
// 注意：抽样是按"点"抽，每个点占 3 个 float，必须整组搬运
let Pf = concatF32(PfArr), Kf = concatF32(KfArr), Gf = concatF32(GfArr), Rf = concatF32(RfArr);
let nVertFlower = Pf.length/3;
if(nVertFlower > FLOWER_MAX){
  const keep = sampleWithoutReplacement(nVertFlower, FLOWER_MAX);   // 返回"点"索引
  Pf = gatherVec3(Pf, keep);
  Kf = gatherScalar(Kf, keep);
  Gf = gatherScalar(Gf, keep);
  Rf = gatherScalar(Rf, keep);
  nVertFlower = FLOWER_MAX;
}

function concatF32(list){
  let tot=0; for(const a of list) tot+=a.length;
  const out=new Float32Array(tot); let p=0;
  for(const a of list){ out.set(a,p); p+=a.length; }
  return out;
}
/* 按点索引抽取 xyz（每点 3 个 float） */
function gatherVec3(src, idx){
  const out=new Float32Array(idx.length*3);
  for(let i=0;i<idx.length;i++){
    const s=idx[i]*3, d=i*3;
    out[d]  = src[s];
    out[d+1]= src[s+1];
    out[d+2]= src[s+2];
  }
  return out;
}
/* 按点索引抽取每点 1 个 float */
function gatherScalar(src, idx){
  const out=new Float32Array(idx.length);
  for(let i=0;i<idx.length;i++) out[i]=src[idx[i]];
  return out;
}
/* 蓄水池抽样：等概率、无放回、省内存 */
function sampleWithoutReplacement(n, k){
  const idx=[];
  for(let i=0;i<k;i++) idx.push(i);
  const rng2 = mulberry32(777);
  for(let i=k;i<n;i++){
    const j = Math.floor(rng2()*(i+1));
    if(j<k) idx[j]=i;
  }
  return idx;
}

/* 绳子（垂绳 + 吊绳），每根两段 */
const PrArr=[], KrArr=[], GrArr=[], RrArr=[];
for(let i=0;i<N_ROPES;i++){
  const ang=i*2*Math.PI/N_ROPES;
  const x0=RING_R*Math.cos(ang), y0=RING_R*Math.sin(ang);
  const segs=[
    // ★ 绳密度（"增加粒子数"改动）：垂绳 600→900 段、吊绳 300→450 段，周向 14→18
    tubeMesh([x0,y0,ROPE_TOP_Z],[x0,y0,ROPE_TOP_Z-ROPE_LEN],ROPE_R,900,18),
    tubeMesh([0,0,TOP_BIND_Z],[x0,y0,ROPE_TOP_Z],TOP_ROPES_R,450,18)
  ];
  for(const seg of segs){
    const n=seg.length/3;
    const P=new Float32Array(n*3), K=new Float32Array(n), G=new Float32Array(n), R=new Float32Array(n);
    for(let k=0;k<n;k++){
      P[k*3]   = seg[k*3]   + rndNN()*0.002;
      P[k*3+1] = seg[k*3+1] + rndNN()*0.002;
      P[k*3+2] = seg[k*3+2] + rndNN()*0.002;
      K[k]=2.0; G[k]=-1.0; R[k]=i;
    }
    PrArr.push(P); KrArr.push(K); GrArr.push(G); RrArr.push(R);
  }
}
const Pr=concatF32(PrArr), Kr=concatF32(KrArr), Gr=concatF32(GrArr), Rr=concatF32(RrArr);
// 不需要抽样：绳子总点数（约 14.6 万）远低于 Python 注释暗示的规模

/* 圆环 */
const PgRaw = ringMesh();
const Pg = new Float32Array(PgRaw.length);
for(let i=0;i<PgRaw.length;i++) Pg[i]=PgRaw[i]+rndNN()*0.002;
const Kg = new Float32Array(Pg.length/3).fill(3.0);
const Gg = new Float32Array(Pg.length/3).fill(-1.0);
const Rg = new Float32Array(Pg.length/3);          // 0

/* 蝴蝶结 */
const PbRaw = bowPts([0,0,TOP_BIND_Z], 1.2);
const Pb = PbRaw;
const Kb = new Float32Array(Pb.length/3).fill(3.0);
const Gb = new Float32Array(Pb.length/3).fill(-1.0);
const Rb = new Float32Array(Pb.length/3);

/* 合并：类型 K、组 G、绳 R 用整数描述 */
const segsP=[Pf,Pr,Pg,Pb], segsK=[Kf,Kr,Kg,Kb], segsG=[Gf,Gr,Gg,Gb], segsR=[Rf,Rr,Rg,Rb];
const P=concatF32(segsP), K=concatF32(segsK), G=concatF32(segsG), R=concatF32(segsR);
const N = P.length/3 | 0;

/* 顶点属性：位置(3)+类型+组+绳+光晕+相位+频率 = 9 float */
const vertexData = new Float32Array(N*9);
for(let i=0;i<N;i++){
  vertexData[i*9+0]=P[i*3];
  vertexData[i*9+1]=P[i*3+1];
  vertexData[i*9+2]=P[i*3+2];
  vertexData[i*9+3]=K[i];
  vertexData[i*9+4]=G[i];
  vertexData[i*9+5]=R[i];
  vertexData[i*9+6]= rnd()<0.02 ? 1 : 0;      // halo
  vertexData[i*9+7]= rndUni(0,2*Math.PI);     // phase
  vertexData[i*9+8]= rndUni(0.8,2.5);         // freq
}
const flowerCentersArr = new Float32Array(flowerCenters.flat());
const n_fl = flowerCenters.length;

/* -------------------- 相机（与 Python 同参） -------------------- */
const EYE=[-8.5,-13.0,2.5], TGT=[0,0,-2.4], UPv=[0,0,1];
let cF=norm3(sub3(TGT,EYE));
let cR=norm3(cross3(cF,UPv));
let cU=cross3(cR,cF);
function sub3(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross3(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm3(a){const l=Math.hypot(a[0],a[1],a[2])||1e-9;return [a[0]/l,a[1]/l,a[2]/l];}
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

/* compute_view：把整束点云框进画面 */
function computeView(pts, W, H){
  let uMin=1e9,uMax=-1e9,vMin=1e9,vMax=-1e9;
  for(let i=0;i<pts.length;i+=3){
    const d=[pts[i]-EYE[0], pts[i+1]-EYE[1], pts[i+2]-EYE[2]];
    const zc=Math.max(dot3(d,cF),0.5);
    const u=dot3(d,cR)/zc, v=dot3(d,cU)/zc;
    if(u<uMin)uMin=u; if(u>uMax)uMax=u;
    if(v<vMin)vMin=v; if(v>vMax)vMax=v;
  }
  const sc = Math.min(W*0.6/(uMax-uMin||1), H*0.6/(vMax-vMin||1))*1.5;
  const cu = (uMax+uMin)/2, cv=(vMax+vMin)/2;
  // Python: sy = H/2 - (v-cv)*sc ; YO = H - sy.max() - 12
  let syMax=-1e9;
  for(let i=0;i<pts.length;i+=3){
    const d=[pts[i]-EYE[0], pts[i+1]-EYE[1], pts[i+2]-EYE[2]];
    const zc=Math.max(dot3(d,cF),0.5);
    const v=dot3(d,cU)/zc;
    const sy=H/2-(v-cv)*sc;
    if(sy>syMax) syMax=sy;
  }
  return [sc, cu, cv, H-syMax-12];
}

/* -------------------- 着色器（GLSL ES 3.00） -------------------- */
const VS = `#version 300 es
precision highp float;
uniform vec3 u_eye;
uniform vec3 u_cam_r, u_cam_u, u_cam_f;
uniform vec2 u_resolution;
uniform float u_SC, u_CU, u_CV, u_Y_OFF;
uniform float u_time, u_gust, u_pivot_z, u_sway_amp;
uniform float u_rot, u_rot_speed, u_centrifugal, u_wind_strength;
uniform float u_flower_gain, u_rope_gain, u_ring_gain;
uniform float u_dpr;                            // ★ 修复高DPI屏幕点过小
uniform vec3 u_flower_color, u_rope_color, u_ring_color;
uniform vec3 u_growth_pts[36];
in vec3 in_pos;
in float in_kind; in float in_group; in float in_rope;
in float in_halo; in float in_phase; in float in_freq;
out vec3 v_color;
out float v_alpha;
out float v_p;
float centrifuge(float r){
  float x = u_centrifugal*u_rot_speed*u_rot_speed*r;
  return x/(1.0+x);
}
void main(){
  vec3 p = in_pos;
  int g = int(in_group + 0.5);
  float pr = in_rope*1.05;
  // 摇摆：多频叠加（与 CPU 版 flower_world 保持一致，均为加号）
  float ax = sin(u_time*0.72 + pr)
           + 0.30*sin(u_time*1.45 + pr + 0.7)
           - 0.08*sin(u_time*2.60 + pr*1.5 + 2.3);
  float ay = sin(u_time*0.58 + pr*0.9 + 2.1)
           - 0.25*sin(u_time*1.35 + pr*1.1 + 1.1);
  float sx = u_sway_amp*u_gust*ax;
  float sy = u_sway_amp*0.75*u_gust*ay;
  if(in_kind < 0.5){
    vec3 gp = u_growth_pts[g];
    vec3 gs = gp + vec3(sx*(u_pivot_z-gp.z), sy*(u_pivot_z-gp.z), 0.0);
    float rg = length(gs.xy);
    if(rg > 0.01) gs.xy += (gs.xy/rg)*centrifuge(rg);
    vec3 d = p - gp;
    float ca = cos(-sx), sa = sin(-sx);
    vec3 n1 = vec3(d.x*ca + d.z*sa, d.y, -d.x*sa + d.z*ca);
    float cb = cos(sy), sb = sin(sy);
    p = gs + vec3(n1.x, n1.y*cb - n1.z*sb, n1.y*sb + n1.z*cb);
  }else{
    if(p.z < u_pivot_z){
      float dp = max(u_pivot_z - p.z, 0.0);
      p.x += sx*dp;
      p.y += sy*dp;
    }
    float r = length(p.xy);
    if(r > 0.01) p.xy += (p.xy/r)*centrifuge(r);
  }
  float cr = cos(u_rot), sr = sin(u_rot);
  p = vec3(p.x*cr - p.y*sr, p.x*sr + p.y*cr, p.z);
  float wa = 0.7 + 0.5*sin(u_time*0.23);
  vec2 wd = normalize(vec2(cos(wa), sin(wa)));
  float wv = 0.75 + 0.30*sin(u_time*0.51)
           - 0.20*sin(u_time*1.13 + 1.7)
           - 0.10*sin(u_time*2.31 + 3.3);
  float df = clamp((u_pivot_z - p.z)/4.0, 0.0, 1.0);
  p.xy += wd*u_wind_strength*wv*df;
  vec3 d = p - u_eye;
  float zc = max(dot(d, u_cam_f), 0.5);
  float uu = dot(d, u_cam_r)/zc;
  float vv = dot(d, u_cam_u)/zc;
  float sX = u_resolution.x*0.5 + (uu - u_CU)*u_SC;
  float sY = u_resolution.y*0.5 - (vv - u_CV)*u_SC + u_Y_OFF;
  gl_Position = vec4(sX/u_resolution.x*2.0 - 1.0,
                     1.0 - sY/u_resolution.y*2.0, 0.0, 1.0);
  float zn = clamp((zc - 0.5)/25.0, 0.0, 1.0);
  float near = 1.0 - 0.6*zn;
  float bs, pe, gain;
  vec3 col;
  /* ★ 点径基准：由 5.0/3.2/4.0 降到 3.4/2.2/2.8，
     配合上面的 *u_dpr，使 dpr=1 时视觉略小于原值、dpr=2~3 时也不至于糊成大色块。 */
  if(in_kind < 0.5)      { bs = 3.4; pe = 4.4; col = u_flower_color; gain = u_flower_gain; }
  else if(in_kind < 2.5) { bs = 2.2; pe = 3.2; col = u_rope_color;   gain = u_rope_gain; }
  else                   { bs = 2.8; pe = 3.6; col = u_ring_color;   gain = u_ring_gain; }
  if(in_halo > 0.5){ bs *= 1.9; pe = 3.9; }
  if(zn > 0.55) bs *= 0.6;
  /* ★ 修复：原先 bs 是"物理像素"常量，在高 DPI 手机(dpr 2~3)上等效 CSS 仅 1.7~2.5px，
     而画面内容被放大到 2000+ 物理像素，点相对整体小得几乎看不见 → 显得又暗又糊。
     这里按 u_dpr 把点放大回一致的视觉尺寸（桌面 dpr=1 时不变）。 */
  gl_PointSize = max(1.0, bs*near*u_dpr);
  float br = (0.70 + 0.30*sin(in_phase + u_time*in_freq))*(1.0 - 0.30*zn);
  float fb = br*gain;
  if(in_halo > 0.5) fb *= 2.0;
  v_color = col;
  v_alpha = fb;
  v_p = pe;
}`;

const FS = `#version 300 es
precision highp float;
in vec3 v_color;
in float v_alpha;
in float v_p;
out vec4 fc;
void main(){
  vec2 c = gl_PointCoord - vec2(0.5);
  float r = length(c)*2.0;
  if(r > 1.0) discard;
  fc = vec4(v_color*v_alpha*pow(1.0 - r, v_p), 1.0);
}`;

const VS_P = `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_dpr;                  // ★ 高DPI修正（花粉同样需要）
in vec2 in_pos;
in float in_bri;
in float in_size;
out float va;
void main(){
  gl_Position = vec4(in_pos.x/u_resolution.x*2.0 - 1.0,
                     1.0 - in_pos.y/u_resolution.y*2.0, 0.0, 1.0);
  gl_PointSize = max(1.0, in_size*u_dpr);
  va = in_bri;
}`;

const FS_P = `#version 300 es
precision highp float;
in float va;
out vec4 fc;
void main(){
  vec2 c = gl_PointCoord - vec2(0.5);
  float r = length(c)*2.0;
  if(r > 1.0) discard;
  fc = vec4(vec3(50.0,110.0,230.0)/255.0*va*pow(1.0 - r, 2.8), 1.0);
}`;

/* -------------------- 编译 & 链接 -------------------- */
function compile(type, src, tag){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    console.error(tag+' 编译失败:\n'+log);
    throw new Error(tag+' 编译失败: '+log);
  }
  return s;
}
function link(vsSrc, fsSrc, tag){
  const p=gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc, tag+'.vs'));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc, tag+'.fs'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
    throw new Error(tag+' 链接失败: '+gl.getProgramInfoLog(p));
  }
  return p;
}
const prog = link(VS, FS, 'main');
const progP = link(VS_P, FS_P, 'pollen');

function U(p,n){ return gl.getUniformLocation(p,n); }

/* -------------------- 主 VAO -------------------- */

{

/* ★ 设备像素比：必须在下方 uniform 设置之前声明（原来在"视图自适应"处，

/* 静态 uniform */

const Umain = {};
for(const n of ['u_eye','u_cam_r','u_cam_u','u_cam_f','u_resolution','u_SC','u_CU','u_CV',
                'u_Y_OFF','u_pivot_z','u_sway_amp','u_rot','u_rot_speed','u_centrifugal',
                'u_wind_strength','u_flower_gain','u_rope_gain','u_ring_gain','u_dpr',
                'u_flower_color','u_rope_color','u_ring_color','u_growth_pts','u_time','u_gust']){

}
gl.uniform3fv(Umain.u_eye, EYE);
gl.uniform3fv(Umain.u_cam_r, cR);
gl.uniform3fv(Umain.u_cam_u, cU);
gl.uniform3fv(Umain.u_cam_f, cF);
gl.uniform1f(Umain.u_pivot_z, PIVOT_Z);
gl.uniform1f(Umain.u_sway_amp, SWAY);
gl.uniform1f(Umain.u_rot, 0);
gl.uniform1f(Umain.u_rot_speed, ROT_SPEED);
gl.uniform1f(Umain.u_centrifugal, CENTRIFUGAL);
gl.uniform1f(Umain.u_wind_strength, WIND_STRENGTH);
/* 配色：
   ★ "去除手机限制"：原先手机会压黑背景 + 提饱和度（IS_SMALL 分支），
     现已移除，所有设备统一使用与 Python 原版一致的配色。
   保留 sat() 只是为了让色值有个统一的夹紧入口（k=1.0 时等于原值）。 */
const MOB_BG  = [0.012, 0.012, 0.039];        // 统一背景色（原桌面值）
const MOB_SAT = 1.0;                          // 不再加深，保持原始颜色
function sat(c, k){                            // 向"更饱和"方向推，再夹紧
  const g = c[0]*0.299 + c[1]*0.587 + c[2]*0.114;
  return [
    Math.min(1, Math.max(0, g + (c[0]-g)*k)),
    Math.min(1, Math.max(0, g + (c[1]-g)*k)),
    Math.min(1, Math.max(0, g + (c[2]-g)*k))
  ];
}
const fcol = sat([0.55,0.35,1.00], MOB_SAT);
const rcol = sat([0.78,0.66,0.39], MOB_SAT);
const gcol = sat([1.00,0.85,0.30], MOB_SAT);

/* ★ 亮度：原 0.95/0.75/2.0 —— 高 DPI 下点变小、叠加变少，整体偏暗。

   花 1.60 → 1.90、绳 1.05 → 1.30；环保持 1.8 避免喧宾夺主。 */

gl.uniform1f(Umain.u_rope_gain,   1.30);

gl.uniform3f(Umain.u_flower_color, fcol[0], fcol[1], fcol[2]);

/* 预计算花朵的屏幕坐标（CPU 端，供花粉发射用） */
const flowerIdx = [];
{
  for(let i=0;i<N;i++) if(K[i] < 0.5) flowerIdx.push(i);
}
let sxa = new Float32Array(N), sya = new Float32Array(N);
function projectAll(){
  for(let i=0;i<N;i++){
    const d=[P[i*3]-EYE[0], P[i*3+1]-EYE[1], P[i*3+2]-EYE[2]];
    const zc=Math.max(dot3(d,cF),0.5);
    const uu=dot3(d,cR)/zc, vv=dot3(d,cU)/zc;
    sxa[i]=W*0.5 + (uu-viewCU)*SC;
    sya[i]=H*0.5 - (vv-viewCV)*SC + YO;
  }
}

/* =============================================================
   Web Audio：玻璃风铃音（对应 make_glass_sounds）
   基频 × 非谐波倍频 2.756 / 5.404 / 8.933 —— 这是金属/玻璃的音色特征
   ============================================================= */
const FREQS = [1046.50,1174.66,1318.51,1396.91,1567.98,1760.00,1975.53,2093.00];
let actx=null, masterGain=null, soundBufs=[];
let audioReady=false;

function buildGlassSounds(){
  const sr = actx.sampleRate;
  const dur = 0.75;
  const n = Math.floor(sr*dur);
  soundBufs = FREQS.map(base=>{
    const f0 = base*(0.97+0.06*Math.random());
    const buf = actx.createBuffer(2, n, sr);
    const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    let peak=1e-9;
    const raw = new Float32Array(n);
    for(let i=0;i<n;i++){
      const t = i/sr;
      let w = Math.sin(2*Math.PI*f0*t);
      w += Math.sin(2*Math.PI*f0*2.756*t)*0.45;
      w += Math.sin(2*Math.PI*f0*5.404*t)*0.22;
      w += Math.sin(2*Math.PI*f0*8.933*t)*0.10;
      w *= Math.min(1, t*4000)*Math.exp(-t*5.5);
      w *= 1 + 0.05*Math.sin(2*Math.PI*30*t)*Math.exp(-t*8);
      raw[i]=w;
      const a=Math.abs(w); if(a>peak) peak=a;
    }
    for(let i=0;i<n;i++){
      const v = raw[i]/peak*0.42;
      L[i]=v; Rr[i]=v;
    }
    return buf;
  });
  audioReady = true;
}
function initAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  masterGain = actx.createGain();
  masterGain.gain.value = 1.0;
  masterGain.connect(actx.destination);
  buildGlassSounds();
}
function playClash(pitch=0.0, vol=1.0){
  if(!audioReady || muted || !actx) return;
  if(actx.state==='suspended') actx.resume();
  const i = Math.max(0, Math.min(soundBufs.length-1, Math.round(pitch*(soundBufs.length-1))));
  const src = actx.createBufferSource();
  src.buffer = soundBufs[i];
  const g = actx.createGain();
  g.gain.value = Math.max(0, Math.min(1, vol));
  src.connect(g); g.connect(masterGain);
  src.start();
}

/* =============================================================
   CPU 端花朵世界坐标（碰撞检测用，对应 flower_world）
   ============================================================= */
const fwX = new Float64Array(n_fl), fwY = new Float64Array(n_fl), fwZ = new Float64Array(n_fl);
const prArr = new Float64Array(n_fl);
for(let i=0;i<n_fl;i++) prArr[i] = Math.floor(i/N_FL_PER_ROPE)*1.05;

function flowerWorld(rot, t, gust){
  for(let i=0;i<n_fl;i++){
    let x = flowerCenters[i][0], y = flowerCenters[i][1], z = flowerCenters[i][2];
    const pr = prArr[i];
    const ax = Math.sin(t*0.72+pr) + 0.30*Math.sin(t*1.45+pr+0.7)
             - 0.08*Math.sin(t*2.60+pr*1.5+2.3);
    const ay = Math.sin(t*0.58+pr*0.9+2.1) - 0.25*Math.sin(t*1.35+pr*1.1+1.1);
    const L = PIVOT_Z - z;
    x += SWAY*gust*ax*L;
    y += SWAY*0.75*gust*ay*L;
    const rxy = Math.hypot(x,y)+1e-6;
    const rawv = CENTRIFUGAL*ROT_SPEED*ROT_SPEED*rxy;
    const k = rawv/(1+rawv);
    x += (x/rxy)*k;
    y += (y/rxy)*k;
    const cr=Math.cos(rot), sr=Math.sin(rot);
    const nx = x*cr - y*sr, ny = x*sr + y*cr;
    x=nx; y=ny;
    const wa = 0.7+0.5*Math.sin(t*0.23);
    const wdx=Math.cos(wa), wdy=Math.sin(wa);
    const wv = 0.75 + 0.30*Math.sin(t*0.51) - 0.20*Math.sin(t*1.13+1.7) - 0.10*Math.sin(t*2.31+3.3);
    const df = Math.max(0, Math.min(1, (PIVOT_Z - z)/4));
    x += wdx*WIND_STRENGTH*wv*df;
    y += wdy*WIND_STRENGTH*wv*df;
    fwX[i]=x; fwY[i]=y; fwZ[i]=z;
  }
}

/* 只算上三角，省一半开销 */
const triI=[], triJ=[];
for(let i=0;i<N_FL;i++) for(let j=i+1;j<N_FL;j++){ triI.push(i); triJ.push(j); }
const NT = triI.length;
let prevDist = null;

/* -------------------- 花粉状态 -------------------- */
const pm = new Float32Array(NP).fill(1);
const pl = new Float32Array(NP);
const ppx = new Float32Array(NP), ppy = new Float32Array(NP);
const pvx = new Float32Array(NP), pvy = new Float32Array(NP);
const pph = new Float32Array(NP), pfr = new Float32Array(NP), psj = new Float32Array(NP);
for(let i=0;i<NP;i++){
  pph[i]=rndUni(0,2*Math.PI);
  pfr[i]=rndUni(6,14);
  psj[i]=rndUni(0.65,1.45);
}
let plHead=0;

/* -------------------- 主循环 -------------------- */
let t=0, rot=0, lastT=performance.now()/1000, running=false;

function frame(){
  requestAnimationFrame(frame);
  if(!running) return;

  const now = performance.now()/1000;
  let dt = now - lastT;
  if(!isFinite(dt) || dt<0) dt=0;
  dt = Math.min(dt, 0.05);
  lastT = now;
  t += dt;
  rot += ROT_SPEED*dt;

  gl.clearColor(MOB_BG[0], MOB_BG[1], MOB_BG[2], 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // 阵风
  const gust = Math.max(0.65 + 0.25*Math.sin(t*0.31)
             - 0.15*Math.sin(t*0.57+1.7)
             - 0.10*Math.sin(t*1.07+4.2), 0.15);

  gl.useProgram(prog);
  gl.uniform1f(Umain.u_gust, gust);
  gl.uniform1f(Umain.u_time, t);
  gl.uniform1f(Umain.u_rot, rot);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.bindVertexArray(null);

  /* ---- 碰撞检测：仅在本帧"由远到近"跨越阈值时触发 ---- */
  flowerWorld(rot, t, gust);
  const dist = new Float32Array(NT);
  for(let k=0;k<NT;k++){
    const i=triI[k], j=triJ[k];
    const dx=fwX[i]-fwX[j], dy=fwY[i]-fwY[j], dz=fwZ[i]-fwZ[j];
    dist[k]=Math.sqrt(dx*dx+dy*dy+dz*dz);
  }
  if(prevDist){
    const hits=[];
    for(let k=0;k<NT;k++){
      if(dist[k] < CLASH_THRESHOLD_3D && prevDist[k] >= CLASH_THRESHOLD_3D) hits.push(k);
    }
    if(hits.length){
      let use = hits;
      if(use.length > MAX_CLASH_PER_FRAME){
        // 随机取 MAX_CLASH_PER_FRAME 个
        for(let i=use.length-1;i>0;i--){ const j=rndInt(i+1); const tmp=use[i]; use[i]=use[j]; use[j]=tmp; }
        use = use.slice(0, MAX_CLASH_PER_FRAME);
      }
      for(const k of use){
        const fi=triI[k], fj=triJ[k];
        const za = (flowerCenters[fi][2] + flowerCenters[fj][2])*0.5;
        const pitch = Math.max(0, Math.min(1, -za/ROPE_LEN));
        playClash(pitch, 0.35 + 0.55*Math.random());
      }
    }
  }
  prevDist = dist;

  /* ---- 花粉 ---- */
  // ★ 发射速率（"增加粒子数"改动）：每帧 6 → 14 次尝试，配合 NP 增大
  for(let s=0;s<14;s++){
    if(rnd() < 0.9){
      const i = plHead;
      plHead = (plHead+1)%NP;
      const fi = flowerIdx[rndInt(flowerIdx.length)];
      ppx[i] = sxa[fi] + rndNN()*12;
      ppy[i] = sya[fi] + rndNN()*12;
      pvx[i] = rndNN()*12;
      pvy[i] = rndUni(20,60);
      pm[i]  = rndUni(1.5,3.5);
      pl[i]  = 1.0;
    }
  }
  for(let i=0;i<NP;i++){
    if(pl[i] <= 0) continue;
    pvx[i] *= 1 - 0.6*dt;
    pvy[i] *= 1 - 0.6*dt;
    ppx[i] += pvx[i]*dt + 12*Math.sin(t*1.3 + ppx[i]*0.02)*dt;
    ppy[i] += pvy[i]*dt;
    pl[i]  -= dt/pm[i];
  }
  // 填缓冲
  plData.fill(0);
  let any=false;
  for(let i=0;i<NP;i++){
    if(pl[i] <= 0) continue;
    any=true;
    const fl = Math.pow(Math.max(0, Math.sin(t*pfr[i]+pph[i])), 3);
    const br = pl[i]*(0.30 + 1.8*fl)*psj[i];
    plData[i*4+0] = ppx[i];
    plData[i*4+1] = ppy[i];
    plData[i*4+2] = br;
    plData[i*4+3] = 4*psj[i];
  }
  if(any){
    gl.useProgram(progP);
    gl.bindBuffer(gl.ARRAY_BUFFER, plVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, plData);
    gl.bindVertexArray(plVao);
    gl.drawArrays(gl.POINTS, 0, NP);
    gl.bindVertexArray(null);
  }
}

/* -------------------- 交互 -------------------- */
const startEl = document.getElementById('start');
startEl.addEventListener('click', ()=>{
  startEl.classList.add('hidden');
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  lastT = performance.now()/1000;
  if(!running){ running=true; }
  // 复位时间轴，避免暂停期间跳跃
  t = 0; rot = 0; prevDist = null;
});
addEventListener('keydown', e=>{
  if(e.key==='m' || e.key==='M'){
    muted = !muted;
    if(masterGain) masterGain.gain.value = muted ? 0 : 1;
  }
});

/* 启动 */
resize();
running = true;               // 先渲染画面（声音等用户点击后再开）
requestAnimationFrame(frame);

// ★ 日志中各部分数量改为动态计算，避免"增加粒子数"后硬编码数字与实际不符

            '（花朵', nVertFlower,
            '+ 绳', Pr.length/3,
            '+ 环', Pg.length/3,
            '+ 蝴蝶结', Pb.length/3, '）');
console.log('花朵数 n_fl =', n_fl, '，碰撞对 =', NT);
